name: Build & Release
on:
  push:
    paths: ['daddy/src/**', 'patches/**', 'build-ci.sh']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: pQu4k3r/vavoo_android-releases
      UPSTREAM_TAG: v1.3.5
      APK_NAME: VavooStream-1.3.5-ITA-Daddy.apk
      APKTOOL_VER: 3.0.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # build-tools e platform sono già su ubuntu-latest; installa se mancano
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;36.0.0" "platforms;android-36" 2>/dev/null || true
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          [ -f "$BT/d8" ] || BT=$(ls -d ${ANDROID_HOME}/build-tools/3* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          PLATFORM=$(ls -d ${ANDROID_HOME}/platforms/android-3* | sort -V | tail -1)
          echo "PLATFORM=$PLATFORM" >> "$GITHUB_ENV"

      - name: Download apktool
        run: |
          curl -sL -o apktool.jar "https://github.com/AiolosLee/apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar"

      - name: Download upstream APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$UPSTREAM_TAG" --repo "$UPSTREAM_REPO" --pattern '*.apk' --dir orig/
          APK=$(ls orig/*.apk | head -1)
          echo "ORIG_APK=$APK" >> "$GITHUB_ENV"

      - name: Decompile + apply smali patches
        run: |
          java -jar apktool.jar d "$ORIG_APK" -o dec -f
          cp patches/O.smali dec/smali/R2/O.smali
          cp patches/x.smali dec/smali/R2/x.smali

      - name: Compile Proxy Java → classes3.dex
        run: |
          mkdir -p daddy/out daddy/dex
          javac --release 8 -nowarn -d daddy/out \
            -cp "${PLATFORM}/android.jar:daddy/stub" \
            daddy/src/it/daddy/*.java
          rm -rf daddy/out/R2
          ${BT}/d8 --release --min-api 21 \
            --lib "${PLATFORM}/android.jar" \
            --output daddy/dex daddy/out/it/daddy/*.class

      - name: Build APK
        run: |
          java -jar apktool.jar b dec -o build_tmp/u.apk
          python3 -c "
          import zipfile, sys
          z = zipfile.ZipFile(sys.argv[1], 'a', zipfile.ZIP_DEFLATED)
          assert 'classes3.dex' not in z.namelist()
          z.write(sys.argv[2], 'classes3.dex')
          z.close()
          " build_tmp/u.apk daddy/dex/classes.dex
          ${BT}/zipalign -f -p 4 build_tmp/u.apk build_tmp/a.apk

      - name: Decode keystore & sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/vavoo.jks
          ${BT}/apksigner sign \
            --ks /tmp/vavoo.jks --ks-pass "pass:${KEYSTORE_PASS}" --key-pass "pass:${KEYSTORE_PASS}" \
            --out "$APK_NAME" build_tmp/a.apk
          ${BT}/apksigner verify "$APK_NAME"
          rm /tmp/vavoo.jks
          echo "### Build OK: $APK_NAME" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK_NAME"

      - name: Update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.5-ita"
          # cancella asset vecchio se esiste, poi carica il nuovo
          gh release upload "$TAG" "$APK_NAME" --clobber
          echo "### Release aggiornata: $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: rm -rf dec orig build_tmp daddy/out daddy/dex /tmp/vavoo.jks
